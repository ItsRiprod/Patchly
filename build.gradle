plugins {
    id 'java'
    id 'com.azuredoom.hytale-tools' version '1.0.48'
    id 'com.azuredoom.hytalepublisher' version '1.+'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://www.cursemaven.com" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of((project.java_version as String).toInteger())
    }
    withSourcesJar()
    withJavadocJar()
}


base {
    archivesName = 'Patchly'
}

configurations {
    testCompileOnly.extendsFrom(compileOnly)
    testRuntimeOnly.extendsFrom(compileOnly)
}

dependencies {
    compileOnly libs.jetbrains.annotations
    compileOnly libs.jspecify
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
    // jmh benchmarks live in the test sourceSet so they inherit the compileOnly
    // (server + gson) classpath at both compile and runtime; see the `jmh` task.
    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

hytaleTools {
    javaVersion = project.java_version as Integer
    hytaleVersion = project.hytale_version.toString()
    manifestServerVersion = project.manifestServerVersion.toString()
    manifestGroup = project.manifest_group.toString()
    modId = project.mod_id.toString()
    modDescription = project.mod_description.toString()
    modUrl = project.mod_url.toString()
    mainClass = project.main_class.toString()
    modCredits = project.mod_credits.toString()
    manifestDependencies = project.manifest_dependencies.toString()
    manifestOptionalDependencies = project.manifest_opt_dependencies.toString()
    curseforgeId = project.curseforgeID.toString()
    disabledByDefault = project.disabled_by_default.toString().toBoolean()
    includesPack = project.includes_pack.toString().toBoolean()
    patchline = project.patchline.toString()

    debugEnabled = true
    debugSuspend = false

    requireDcevm = true
} 

hytalePublisher {
    version       = project.version
    releaseType   = "release"
    changelogFile = "changelog.md"
    gameVersion   = project.hytale_version.toString()

    modtale {
        enabled   = true
        projectId = project.modtale_uuid
        patchline = project.patchline.toString()
    }

    curseforge {
        enabled   = true
        projectId = project.curseforgeID
    }

    modifold {
        enabled   = true
        projectId = project.modifold_id
    }
    github {
        enabled = true

        // Let GitHub append its auto-generated notes after the changelog body.
        generateReleaseNotes = true
        // Attach the built jar, sources jar, and javadoc jar. Sources/javadoc are
        // skipped automatically (with a warning) if those tasks aren't present.
        includeJar        = true
        includeSourcesJar = true
        includeJavadocJar = true    
    }


    maven {
        enabled = true

        url         = project.hmod_maven_url.toString()
        snapshotUrl = project.hmod_maven_snapshot_url.toString()

        groupId    = project.maven_group_id.toString()
        artifactId = project.maven_artifact_id.toString()

        includeJar        = true
        includeSourcesJar = true
        includeJavadocJar = true

        pomName        = project.mod_name.toString()
        pomDescription = project.mod_description.toString()
        pomUrl         = project.mod_sources.toString()

        pom { pom ->
            pom.licenses {
                license {
                    name = project.mod_license.toString()
                    url  = "https://www.gnu.org/licenses/gpl-3.0.html"
                }
            }
            pom.developers {
                developer {
                    id   = project.mod_author.toString()
                    name = project.mod_author.toString()
                }
            }
            pom.scm {
                url                 = project.mod_sources.toString()
                connection          = "scm:git:${project.mod_sources}.git"
                developerConnection = "scm:git:${project.mod_sources}.git"
            }
        }
    }
}

def generateVersionSource = tasks.register('generateVersionSource') {
    def outputDir = layout.buildDirectory.dir('generated/sources/patchlyVersion')
    def pluginVersion = project.version.toString()
    inputs.property('pluginVersion', pluginVersion)
    outputs.dir(outputDir)
    doLast {
        def pkg = outputDir.get().dir('com/riprod/patchly').asFile
        pkg.mkdirs()
        new File(pkg, 'BuildInfo.java').text = """package com.riprod.patchly;

public final class BuildInfo {
    public static final String VERSION = "${pluginVersion}";

    private BuildInfo() {
    }
}
"""
    }
}

sourceSets.main.java.srcDir(generateVersionSource)

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// runs the pure-core JMH benchmarks on the test runtime classpath.
//   ./gradlew jmh                 (all benchmarks)
//   ./gradlew jmh -Pbench=Merge   (regex filter on benchmark class/method)
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Run pure-core JMH benchmarks (MergeEngine/Compiler/DeepNest)'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    def filter = project.findProperty('bench') ?: '.*Bench.*'
    args(filter as String)
    // extra JMH flags, e.g. -PjmhArgs='-f 1 -wi 1 -i 1 -rf json -rff out.json'
    def extra = project.findProperty('jmhArgs')
    if (extra) {
        args((extra as String).split('\\s+'))
    }
}